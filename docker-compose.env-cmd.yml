services:
  api:
    build: .
    depends_on: [postgres]
    ports: ["${APP_PORT:-8080}:8080"]
    env_file: [.env]
    networks: [app_net]
    volumes:
      - ./app:/app/app:ro
      - app_static:/app/static
    environment:
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "${APP_PORT:-8080}"
    command: ["uvicorn", "app.main:app", "--host", "${UVICORN_HOST}", "--port", "${UVICORN_PORT}"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USER:-app}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-app_password}
      POSTGRES_DB: ${DATABASE_NAME:-app_db}
    ports: ["5432:5432"]
    networks: [app_net]
    volumes:
      - db_data:/var/lib/postgresql/data

networks:
  app_net:
    driver: bridge

volumes:
  db_data:
  app_static:
